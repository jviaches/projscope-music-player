name: 'Release'

on:
  push:
    tags:
      - 'v*'

jobs:

  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm i

      - name: Build Angular app
        run: npm run build:prod

      - name: Package Windows
        run: npx electron-builder build --win --publish never

      - name: Upload Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  release-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm i

      - name: Build Angular app
        run: npm run build:prod

      - name: Package Linux
        run: npx electron-builder build --linux --publish never

      - name: Upload Linux artifacts
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's new in ${{ github.ref_name }}

            ### ✨ New Features
            - **Streaming support** — Add any HTTP/HTTPS audio stream, direct URL, or RSS/podcast feed to your playlist. A live indicator appears while a stream is playing.

            ### 🐛 Bug Fixes
            - Fixed blank window on startup in packaged build (ES module CORS issue with `file://`)
            - Fixed local file playback in packaged build (`media://` protocol for same-origin audio)
            - Fixed `LIVE` badge showing on regular songs or while paused

            ## Downloads

            ### Windows
            | File | Description |
            |------|-------------|
            | `*-Setup-*-x64.exe` | NSIS installer (recommended) |
            | `*-*-x64.exe` (portable) | No install needed |

            ### Linux
            | File | Description |
            |------|-------------|
            | `*.AppImage` | Universal — works on any distro |
            | `*.deb` | Debian / Ubuntu |
            | `*.rpm` | Fedora / RHEL |
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
